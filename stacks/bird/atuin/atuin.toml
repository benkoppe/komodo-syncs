[[stack]]
name = "atuin"
deploy = true
tags = ["syncs"]
[stack.config]
server_id = "bird"

auto_pull = true
auto_update = true
destroy_before_deploy = true

linked_repo = "komodo-syncs-bird"
run_directory = "./stacks/bird/atuin"

environment = """
  ATUIN_DB_NAME=atuin
  ATUIN_DB_USERNAME=atuin
"""
additional_env_files = ["./bird.env"]
